<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
  <title id="t">Un par de cholas en la arena de la playa, con el mar al fondo</title>
  <!-- Hero illustration (placeholder until the real photo exists).
       Sky, a narrow band of sea and a wide beach where someone
       has left a pair of cholas (flip-flops), with footprints to the water. -->
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a9d9e6"/>
      <stop offset="1" stop-color="#f4b99d"/>
    </linearGradient>
    <linearGradient id="sea" x2=".15" y2="1">
      <stop stop-color="#65b9d0"/>
      <stop offset="1" stop-color="#a9e0e8"/>
    </linearGradient>
    <linearGradient id="sand" x2=".2" y2="1">
      <stop stop-color="#e2c29b"/>
      <stop offset="1" stop-color="#f1d6b3"/>
    </linearGradient>
    <!-- one chola, centred on (205, 300) in its own coordinates -->
    <g id="chola" stroke="#222" stroke-linejoin="round" stroke-linecap="round">
      <path transform="rotate(-18 200 270)"
            d="M200 112c40 0 62 30 62 74 0 34-12 52-14 82-3 40 16 66 16 106 0 46-28 74-64 74s-64-28-64-74c0-40 19-66 16-106-2-30-14-48-14-82 0-44 22-74 62-74z"
            fill="#fff" stroke-width="5"/>
      <path transform="rotate(-18 200 270)"
            d="M150 240C168 214 186 196 200 170C214 196 232 214 250 240"
            fill="none" stroke="#000" stroke-width="14"/>
      <circle transform="rotate(-18 200 270)" cx="200" cy="170" r="8" fill="#000" stroke="none"/>
    </g>
    <!-- a single footprint, toes up -->
    <g id="step" fill="#c9a57c">
      <ellipse cx="0" cy="0" rx="2.2" ry="3.6"/>
      <circle cx="-1.2" cy="-5.2" r=".8"/>
      <circle cx=".6" cy="-5.6" r=".8"/>
      <circle cx="2" cy="-4.8" r=".7"/>
    </g>
  </defs>

  <!-- Sky and sun -->
  <rect width="240" height="80" fill="url(#sky)"/>
  <circle cx="28" cy="44" r="10" fill="#ffe3bd"/>
  <g fill="none" stroke="#7398a0" stroke-width=".7" opacity=".8">
    <path d="M10 23q5-7 11-2 6-8 12 0 8-2 10 4 8 0 10 4H4q2-5 6-6z"/>
    <path d="M78 25q7-7 13-2 5-8 11-1 8-1 10 4h13"/>
    <path d="M179 23q8-9 15-2 7-9 13-1 8-2 12 4 8-1 11 4h-57"/>
  </g>

  <!-- Sea: a narrow band between the horizon and the beach -->
  <path d="M0 70H240V96Q200 100 160 104T80 113T0 121Z" fill="url(#sea)"/>
  <path d="M0 78Q36 75 71 80T142 76T240 72" fill="none" stroke="#f5f0d9" stroke-width="1.6"/>
  <g fill="none" stroke="#f7e6c8" stroke-linecap="round">
    <path d="M10 89q20-4 35 0t30-1"/>
    <path d="M96 86q19-5 38 0t38-1"/>
    <path d="M30 101q19-5 38 0t40-2"/>
    <path d="M150 93q18-4 34-1t30-2"/>
  </g>
  <g fill="none" stroke="#397f94" stroke-width=".8" opacity=".7">
    <path d="M60 83q19-4 33-1M180 82q16-4 30-1M115 97q16-4 30-2"/>
  </g>

  <!-- Shoreline: foam and shallow water over the sand -->
  <path d="M0 121Q40 116 80 113T160 104T240 96V104Q200 109 160 114T80 124T0 132Z"
        fill="#f4d9bd" opacity=".7"/>
  <path d="M0 122Q42 117 82 114T162 105T240 97" fill="none" stroke="#fff4dc" stroke-width="2.5"/>

  <!-- Beach: wet strip, then dry sand down to the bottom edge -->
  <path d="M0 130Q40 125 80 122T160 113T240 104V240H0Z" fill="url(#sand)"/>
  <path d="M0 130Q40 125 80 122T160 113T240 104V112Q200 118 160 122T80 132T0 139Z"
        fill="#cfae86" opacity=".55"/>
  <g fill="none" stroke="#c19c74" stroke-width=".9" stroke-linecap="round" opacity=".8">
    <path d="M14 160q20-5 40-2t34-3"/>
    <path d="M150 150q18-4 36-1t40-3"/>
    <path d="M24 205q22-6 44-3t38-4"/>
    <path d="M170 222q16-4 30-1t30-2"/>
  </g>

  <!-- Footprints from the cholas down to the water -->
  <g opacity=".75">
    <use href="#step" transform="translate(122 154) rotate(-14) scale(1.2)"/>
    <use href="#step" transform="translate(111 145) rotate(-16) scale(-1.2 1.2)"/>
    <use href="#step" transform="translate(102 135) rotate(-14) scale(1.1)"/>
    <use href="#step" transform="translate(92 127) rotate(-16) scale(-1 1)"/>
  </g>

  <!-- A pair of cholas left on the sand, side by side -->
  <!-- soft shadows, cast to the right (the sun is on the left) -->
  <ellipse cx="140" cy="186" rx="9" ry="13" transform="rotate(-14 140 186)" fill="#8a6b4c" opacity=".18"/>
  <ellipse cx="162" cy="192" rx="9" ry="13" transform="rotate(-4 162 192)" fill="#8a6b4c" opacity=".18"/>
  <use href="#chola" transform="translate(136 180) rotate(-14) scale(.16) translate(-205 -300)"/>
  <use href="#chola" transform="translate(158 186) rotate(-4) scale(.16) translate(-205 -300)"/>

  <!-- Pebbles and a shell -->
  <g fill="#6b5747">
    <ellipse cx="40" cy="176" rx="1.5" ry=".8"/>
    <ellipse cx="204" cy="164" rx="1.5" ry=".8"/>
    <ellipse cx="226" cy="192" rx="1.3" ry=".7"/>
    <ellipse cx="88" cy="214" rx="1.6" ry=".8"/>
    <ellipse cx="60" cy="150" rx="1.2" ry=".7"/>
    <ellipse cx="196" cy="230" rx="1.4" ry=".8"/>
  </g>
  <path d="M206 206q8-8 15-2-2 7-10 8-7 1-5-6z" fill="#a7a3a0" stroke="#6b625b" stroke-width="1"/>
  <path d="M209 208q5-4 9-2m-7 4 6-3" fill="none" stroke="#e7dfd4" stroke-width="1"/>
  <path d="M42 222q-4-9 3-13 8-5 13 1m-18 12q-4 8 4 13 6 5 15 0m-14-14q4-5 10-4"
        fill="none" stroke="#91725c" stroke-width="1.4"/>
</svg>
