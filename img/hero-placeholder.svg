<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Chola en la arena (imagen provisional)">
  <!-- Placeholder for the hero photo: a chola (flip-flop) on the sand.
       Replace with the real photo when it exists. Monochrome on purpose. -->
  <defs>
    <pattern id="sand" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.1" fill="#222222" opacity="0.10"/>
      <circle cx="12" cy="9" r="0.9" fill="#222222" opacity="0.08"/>
      <circle cx="7" cy="15" r="1.2" fill="#222222" opacity="0.07"/>
      <circle cx="16" cy="2" r="0.7" fill="#222222" opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#F2F2F2"/>
  <rect width="400" height="500" fill="url(#sand)"/>
  <!-- soft shadow -->
  <ellipse cx="214" cy="292" rx="78" ry="150" transform="rotate(-18 214 292)" fill="#000000" opacity="0.06"/>
  <!-- sole -->
  <path transform="rotate(-18 200 270)"
        d="M200 112c40 0 62 30 62 74 0 34-12 52-14 82-3 40 16 66 16 106 0 46-28 74-64 74s-64-28-64-74c0-40 19-66 16-106-2-30-14-48-14-82 0-44 22-74 62-74z"
        fill="#FFFFFF" stroke="#222222" stroke-width="5"/>
  <!-- strap -->
  <path transform="rotate(-18 200 270)"
        d="M150 240 C168 214 186 196 200 170 C214 196 232 214 250 240"
        fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle transform="rotate(-18 200 270)" cx="200" cy="170" r="8" fill="#000000"/>
  <text x="200" y="470" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13"
